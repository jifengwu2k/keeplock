[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "keeplock"
version = "0.1.0a0"
description = "Deliberate, read-only-mirrorable scratchpad hand-offs over SSH."
readme = "README.md"
requires-python = ">=2"
license = "MIT"
authors = [
  { name="Jifeng Wu", email="jifengwu2k@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "paramiko",
    "typing; python_version < '3.5'"
]

[project.scripts]
keeplock = "keeplock:main"

[project.urls]
"Homepage" = "https://github.com/jifengwu2k/keeplock"
"Bug Tracker" = "https://github.com/jifengwu2k/keeplock/issues"
